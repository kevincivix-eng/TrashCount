name: Supabase keep-alive

# Keeps the free-tier Supabase project awake. A paused project CANNOT be woken by
# an API call — it must be restored manually in the dashboard — so this runs daily
# to stay well inside the ~7-day inactivity window, and fails loudly (GitHub emails
# the repo owner) if the project ever becomes unreachable.

on:
  schedule:
    - cron: '0 5 * * *'   # every day at 05:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SB_URL: https://ogzeldqcivqoehwdsure.supabase.co
      SB_KEY: sb_publishable_iphZYyHG53M_PsGpD3MvAw_fskHdVMl   # publishable key — public by design
    steps:
      - name: Ping Supabase (REST + Auth, with retries)
        run: |
          ok=0
          for i in 1 2 3; do
            rest=$(curl -s -m 25 -o /dev/null -w "%{http_code}" \
              "$SB_URL/rest/v1/scenarios?select=id&limit=1" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" || echo 000)
            auth=$(curl -s -m 25 -o /dev/null -w "%{http_code}" \
              "$SB_URL/auth/v1/settings" -H "apikey: $SB_KEY" || echo 000)
            echo "attempt $i → REST=$rest  AUTH=$auth"
            if [ "$rest" != "000" ]; then ok=1; break; fi
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Supabase is unreachable. The project is almost certainly PAUSED and must be restored manually at supabase.com/dashboard — a keep-alive ping cannot wake a paused project."
            exit 1
          fi
          echo "✅ Supabase is awake and responding."
