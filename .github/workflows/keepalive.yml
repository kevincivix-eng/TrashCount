name: Supabase keep-alive

# Keeps the free-tier Supabase project awake (it auto-pauses after ~7 days of
# inactivity). Sends a tiny REST request every 2 days. The publishable key is
# public by design (it already ships in the client HTML), so it is safe inline.

on:
  schedule:
    - cron: '17 6 */2 * *'   # every 2 days at 06:17 UTC
  workflow_dispatch:          # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" \
            "https://ogzeldqcivqoehwdsure.supabase.co/rest/v1/scenarios?select=id&limit=1" \
            -H "apikey: sb_publishable_iphZYyHG53M_PsGpD3MvAw_fskHdVMl" \
            -H "Authorization: Bearer sb_publishable_iphZYyHG53M_PsGpD3MvAw_fskHdVMl")
          echo "Supabase responded: HTTP $code"
          # Any HTTP response means the project is reachable/awake; fail only on network errors (000).
          if [ "$code" = "000" ]; then echo "No response — request failed"; exit 1; fi
